services:
  - type: web
    name: ada-tool
    runtime: node
    plan: free
    # Free instances use a read-only system image; Chromium is fetched on first
    # scan by @sparticuz/chromium-min into the writable temporary directory.
    buildCommand: npm ci && npm run build:ada
    startCommand: cd apps/ada-tool && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
