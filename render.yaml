services:
  - type: web
    name: ada-tool
    runtime: node
    plan: free
    buildCommand: apt-get update && apt-get install -y chromium-browser && npm ci && npm run build:ada
    startCommand: cd apps/ada-tool && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
